name: Release

# Builds and publishes lazynote binaries for Linux and macOS (no Windows)
# whenever a `v*` tag is pushed, e.g. `v0.0.2`. The tag's version (with the
# leading `v` stripped) is injected into the binary the same way `make build`
# does, via internal/version.Version.

on:
  push:
    tags:
      - "v*"

jobs:
  release:
    name: Build & publish release binaries
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Test
        run: go test ./...

      - name: Derive version from tag
        id: version
        run: echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

      - name: Cross-compile binaries
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail
          mkdir -p dist
          targets="linux/amd64 linux/arm64 darwin/amd64 darwin/arm64"
          for target in $targets; do
            goos="${target%/*}"
            goarch="${target#*/}"
            outdir="dist/lazynote_${VERSION}_${goos}_${goarch}"
            mkdir -p "$outdir"
            echo "Building $goos/$goarch..."
            CGO_ENABLED=0 GOOS="$goos" GOARCH="$goarch" go build \
              -ldflags "-X github.com/tkilb/lazynote/internal/version.Version=${VERSION}" \
              -o "$outdir/lazynote" ./cmd/lazynote
            tar -C dist -czf "dist/lazynote_${VERSION}_${goos}_${goarch}.tar.gz" \
              "lazynote_${VERSION}_${goos}_${goarch}"
            rm -rf "$outdir"
          done

      - name: Generate checksums
        run: cd dist && sha256sum *.tar.gz > checksums.txt

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/*.tar.gz
            dist/checksums.txt
          generate_release_notes: true
